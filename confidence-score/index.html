<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Parent Confidence Score | The Basketball Parent Coach</title>
<meta name="description" content="A two minute check for basketball parents. Answer honestly, get your Confidence Score, and see exactly where to focus next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E8; --card:#FBF6EF; --border:#F1C1B2;
    --ink:#1C1714; --ink-dim:#7A6E64; --accent:#E16143;
    --accent-soft:rgba(225,97,67,0.12); --track:#EFE1D6;
    --navy:#1F3050; --on-navy:#F7F1E8;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5;}
  .wrap{max-width:620px; margin:0 auto; padding:0 22px 90px;}
  .eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 14px;}
  h1,h2{font-family:'Fraunces',serif; font-weight:600; margin:0; color:var(--ink);}
  .screen{display:none;}
  .screen.active{display:block; animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .screen.active{animation:none;} *{transition:none !important; animation-duration:.001s !important;} }

  .intro{padding-top:64px;}
  .intro h1{font-size:32px; line-height:1.15; margin-bottom:16px;}
  .intro p.lede{font-size:16px; color:var(--ink-dim); max-width:52ch; margin-bottom:30px;}
  .btn{display:inline-flex; align-items:center; gap:10px; background:var(--accent); color:#FFF9F5; border:none; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:15px; padding:15px 26px; border-radius:999px; cursor:pointer; text-decoration:none;}
  .btn:hover{background:#CB4F33;}
  .btn:disabled{opacity:.5; cursor:default;}
  .meta-line{margin-top:18px; font-size:13px; color:var(--ink-dim);}
  .gift-note{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:14.5px; color:var(--ink); max-width:52ch; margin:0 0 28px;}
  .gift-note b{color:var(--accent);}
  .meta-line b{color:var(--ink);}

  .checklist{padding-top:54px;}
  .progress-label{font-size:13px; color:var(--ink-dim); margin-bottom:8px;}
  .progress-track{height:4px; background:var(--track); border-radius:4px; margin-bottom:30px; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:var(--accent); transition:width .3s ease;}
  h2.q-head{font-size:24px; margin-bottom:6px;}
  p.q-sub{color:var(--ink-dim); font-size:14px; margin:0 0 26px;}

  .q-card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:30px 26px; margin-bottom:18px;}
  .q-number{font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 12px;}
  .q-text{font-family:'Fraunces',serif; font-size:21px; line-height:1.4; color:var(--ink); margin:0;}
  .q-actions{display:flex; gap:12px; margin-top:24px;}
  .q-btn{flex:1; padding:14px 16px; border-radius:12px; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer; border:1px solid var(--border); background:#FFF; color:var(--ink);}
  .q-btn:hover{border-color:var(--accent);}
  .q-btn.yes{background:var(--accent); border-color:var(--accent); color:#FFF9F5;}
  .q-btn.yes:hover{background:#CB4F33;}
  .q-btn:disabled{opacity:.45; cursor:default;}

  .reaction{
    display:none; background:var(--navy); border-radius:16px; padding:22px 24px; margin-bottom:22px;
    animation:fadeUp .4s ease both;
  }
  .reaction.show{display:block;}
  .reaction-label{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#8FA0BE; font-weight:600; margin:0 0 8px;}
  .reaction-text{font-size:15.5px; line-height:1.55; color:#F2EEE7; margin:0;}
  .next-wrap{text-align:center; margin-top:4px;}

  .row{display:flex; align-items:flex-start; gap:14px; padding:16px; margin-bottom:10px; background:var(--card); border:1px solid var(--border); border-radius:14px; cursor:pointer; user-select:none;}
  .row:hover{border-color:var(--accent);}
  .row input{appearance:none; -webkit-appearance:none; width:22px; height:22px; min-width:22px; margin-top:1px; border:2px solid #D9B8AB; border-radius:6px; background:#FFF; display:grid; place-content:center; cursor:pointer;}
  .row input::before{content:""; width:12px; height:12px; border-radius:3px; background:var(--accent); transform:scale(0); transition:transform .12s ease;}
  .row input:checked::before{transform:scale(1);}
  .row input:checked{border-color:var(--accent);}
  .row.checked{background:var(--accent-soft); border-color:var(--accent);}
  .row label{font-size:15.5px; line-height:1.45; cursor:pointer; color:var(--ink);}
  .continue-wrap{margin-top:30px; text-align:center;}
  .helper-note{font-size:13px; color:var(--ink-dim); margin-top:14px;}

  .gate{padding-top:70px; text-align:center;}
  .gate h2{font-size:26px; margin-bottom:10px;}
  .gate p{color:var(--ink-dim); font-size:15px; max-width:44ch; margin:0 auto 30px;}
  .field{text-align:left; margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:6px;}
  .field input{width:100%; padding:13px 14px; font-size:15px; font-family:inherit; background:#FFF; border:1px solid var(--border); border-radius:10px; color:var(--ink);}
  .field input::placeholder{color:#B7A99C;}
  .form-error{color:var(--accent); font-size:13px; margin-top:10px; display:none;}

  .result{padding-top:56px; text-align:center;}
  .score-card{background:var(--navy); border:1px solid var(--navy); border-radius:20px; padding:38px 24px 30px; margin-bottom:26px;}
  .score-label{font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:#B9C2D4; margin-bottom:10px;}
  .score-number{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:76px; line-height:1; color:var(--on-navy); letter-spacing:-.02em;}
  .score-number .out-of{color:#8290A8; font-size:34px;}
  .band-name{font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:#F0A98C; margin:10px 0 22px;}
  .meter-track{height:10px; background:#33456B; border-radius:999px; overflow:hidden; margin:0 auto; max-width:340px;}
  .meter-fill{height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .result-message{font-size:16px; line-height:1.6; color:var(--ink); max-width:48ch; margin:0 auto 30px;}
  .result-note{font-size:13px;
