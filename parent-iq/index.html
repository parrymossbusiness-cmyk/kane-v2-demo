  </div>

  <!-- 3. PERSISTENT BOTTOM NAVIGATION BAR (ARROWS & PROGRESSION) -->

      <!-- Back Arrow Control -->

        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>

      },
      {

        tagline: "10-minute check-in. Fill this out tonight before Day 1.",
        bodyHTML: `
          <div class="space-y-6">

            <!-- Interactive Slider -->

                <strong>Attention:</strong> If the love-of-the-game number is below 7, that comes before everything else in this system. Read Day 11 tonight, then return here.

        `
      },
      {
        id: "day-1",
        section: "Part 1: The Playbook",
        navLabel: "Day 1: Your Job in 4 Lines",
        title: "Day 1: Players Play. Coaches Coach.",
        tagline: "The car ride home is the most important ten minutes in youth basketball.",
        bodyHTML: `
          <div class="space-y-6 text-gray-300 text-sm sm:text-base leading-relaxed">
            <p>Your child just played in front of a crowd. Maybe they made the mistake everyone saw. Their heart is still racing, they are hungry and tired, and they are replaying every mistake in their head. Then the person whose opinion matters most to them starts talking about the game.</p>
            <p>The car ride home is not your coaching moment. If they want to talk, listen. If they don't, let them process. A child who gets a film session on every drive home learns to dread the drive, and after a while, the game that comes before it.</p>
            
            <div class="p-6 rounded-2xl bg-kaneCard border border-kaneBorder space-y-4">
              <h4 class="text-xs font-bold uppercase tracking-wider text-white">Tonight's Action</h4>
              <p class="text-xs text-gray-400">Say nothing about the game on the drive home. Later, ask Coach Kane's after-game questions. Record what you observed:</p>
              <textarea id="input_day1_log" rows="3" placeholder="What I did... What I noticed... What I will do differently tomorrow..." class="w-full bg-kaneDark border border-kaneBorder rounded-xl p-3 text-sm text-white focus:outline-none focus:border-kaneOrange" oninput="saveInput('day1_log', this.value)"></textarea>
            </div>

      },
      {
        id: "day-10",
        section: "Part 2: The Kane Reset",
        navLabel: "Day 10: Program Check-In",
        title: "Day 10 Check-In: Is the Program Developing Your Kid?",
        tagline: "Score your current club or team on the 10-line Kane Standard.",
        bodyHTML: `
          <div class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <p class="text-sm text-gray-300">Rate each line from 1 (No) to 5 (Consistent Yes). Starters are usually happy; evaluate based on what happens across the entire roster.</p>
              
              <!-- Vault Audio Trigger -->
              <button onclick="triggerAudio('Audio 09: Before You Evaluate an AAU Program', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')" class="flex-shrink-0 flex items-center space-x-2 bg-kaneCard border border-kaneBorder hover:border-kaneOrange px-3.5 py-2 rounded-xl text-xs font-bold text-gray-200 transition">
                <svg class="w-4 h-4 text-kaneOrange" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></svg>

            <!-- Interactive 10-Line Scorecard -->
            <div class="space-y-3">
              <div class="p-4 rounded-xl bg-kaneCard border border-kaneBorder flex items-center justify-between">
                <span class="text-xs text-gray-200">1. Structured, skill-focused practices (not scrimmages)</span>
                <select class="score-input bg-kaneDark border border-kaneBorder text-xs text-white rounded-lg p-2 focus:border-kaneOrange" onchange="calcKaneStandard()">
                  <option value="5">5 - Always</option><option value="4">4 - Mostly</option><option value="3" selected>3 - Sometimes</option><option value="2">2 - Rarely</option><option value="1">1 - Never</option>
                </select>
              </div>
              <div class="p-4 rounded-xl bg-kaneCard border border-kaneBorder flex items-center justify-between">
                <span class="text-xs text-gray-200">2. Clear, honest coach communication</span>
                <select class="score-input bg-kaneDark border border-kaneBorder text-xs text-white rounded-lg p-2 focus:border-kaneOrange" onchange="calcKaneStandard()">
                  <option value="5">5 - Always</option><option value="4">4 - Mostly</option><option value="3" selected>3 - Sometimes</option><option value="2">2 - Rarely</option><option value="1">1 - Never</option>
                </select>
              </div>
              <div class="p-4 rounded-xl bg-kaneCard border border-kaneBorder flex items-center justify-between">
                <span class="text-xs text-gray-200">3. Individual feedback for all players, not just the stars</span>
                <select class="score-input bg-kaneDark border border-kaneBorder text-xs text-white rounded-lg p-2 focus:border-kaneOrange" onchange="calcKaneStandard()">
                  <option value="5">5 - Always</option><option value="4">4 - Mostly</option><option value="3" selected>3 - Sometimes</option><option value="2">2 - Rarely</option><option value="1">1 - Never</option>
                </select>
              </div>
              <div class="p-4 rounded-xl bg-kaneCard border border-kaneBorder flex items-center justify-between">
                <span class="text-xs text-gray-200">4. Transparent full-season financial breakdown</span>
                <select class="score-input bg-kaneDark border border-kaneBorder text-xs text-white rounded-lg p-2 focus:border-kaneOrange" onchange="calcKaneStandard()">
                  <option value="5">5 - Always</option><option value="4">4 - Mostly</option><option value="3" selected>3 - Sometimes</option><option value="2">2 - Rarely</option><option value="1">1 - Never</option>
                </select>
              </div>
            </div>

            <!-- Score Summary Card -->
            <div class="p-5 rounded-2xl bg-kaneCard border border-kaneBorder flex items-center justify-between">
              <div>
                <p class="text-xs text-gray-400 font-bold uppercase">Estimated Kane Standard Score</p>
                <p id="kane-total-text" class="text-xs text-gray-400 mt-1">Status: Moderate Concerns</p>
              </div>
              <span id="kane-score-display" class="text-3xl font-black text-kaneOrange">28 / 50</span>
            </div>

            <!-- Dynamic Upsell Banner (Condition: Score < 30) -->
            <div id="audit-trigger-card" class="p-5 rounded-2xl bg-orange-950/30 border border-kaneOrange/50 space-y-3">
              <span class="text-[10px] font-black uppercase text-kaneOrange tracking-wider">Coach Kane Recommendation</span>
              <h4 class="text-base font-bold text-white">Your program scored under 30. Don't guess on what comes next.</h4>
              <p class="text-xs text-gray-300 leading-relaxed">A low score tells you something is broken, but not whether to stay and fix it or walk away. Book a Future Success Audit to get an objective third-party evaluation.</p>
              <a href="https://kanebasketballacademy.com/services/audits" class="inline-block py-2.5 px-5 bg-kaneOrange hover:bg-orange-600 text-white font-bold text-xs rounded-xl transition shadow-lg">Book The Future Success Audit ($300) &rarr;</a>
            </div>
          </div>
        `
      },
      {
        id: "day-14",
        section: "Part 2: The Kane Reset",
        navLabel: "Day 14: The Final Decision",
        title: "Day 14 Check-In: The Decision",
        tagline: "Before you write the next check, make the decision on purpose.",
        bodyHTML: `
          <div class="space-y-6 text-sm text-gray-300 leading-relaxed">
            <p>Fourteen days ago you started with a quiz and a love-of-the-game score. You have audited your calendar, totaled the real money, and scored the program. Tonight is the decision this system was created for.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <label class="p-5 rounded-2xl bg-kaneCard border border-kaneBorder cursor-pointer hover:border-kaneOrange transition block space-y-2">
                <input type="radio" name="decision" value="stay" class="accent-kaneOrange" onchange="selectDecision('stay')">
                <h5 class="text-white font-bold text-sm">1. Stay The Course</h5>
                <p class="text-xs text-gray-400">The program passed the standard and your family has healthy perspective.</p>
              </label>
              <label class="p-5 rounded-2xl bg-kaneCard border border-kaneBorder cursor-pointer hover:border-kaneOrange transition block space-y-2">
                <input type="radio" name="decision" value="adjust" class="accent-kaneOrange" onchange="selectDecision('adjust')">
                <h5 class="text-white font-bold text-sm">2. Adjust</h5>
                <p class="text-xs text-gray-400">Modify the budget, calendar, or expectations within the current team.</p>
              </label>
              <label class="p-5 rounded-2xl bg-kaneCard border border-kaneBorder cursor-pointer hover:border-kaneOrange transition block space-y-2">
                <input type="radio" name="decision" value="change" class="accent-kaneOrange" onchange="selectDecision('change')">
                <h5 class="text-white font-bold text-sm">3. Change</h5>
                <p class="text-xs text-gray-400">Find a local alternative, take an off-season break, or start fresh.</p>
              </label>
            </div>

            <!-- Dynamic Decision Next Step -->
            <div id="gameplan-card" class="hidden p-6 rounded-2xl bg-kaneCard border border-kaneOrange/60 space-y-4">
              <div class="flex justify-between items-center">
                <span class="text-xs uppercase font-black text-kaneOrange tracking-wider">Your Next Move</span>
                <span class="text-lg font-black text-white">$997</span>
              </div>
              <h4 class="text-base font-bold text-white">Need a customized 90-day plan for your decision?</h4>
              <p class="text-xs text-gray-300">If your decision is to Adjust or Change, Coach Kane will review your film, assess your player's real fundamentals, and write a structured 90-day development roadmap.</p>
              <a href="https://kanebasketballacademy.com/game-plan" class="block w-full py-3 bg-kaneOrange hover:bg-orange-600 text-center font-bold text-xs text-white rounded-xl transition">Enroll in The Game Plan ($997)</a>
            </div>
          </div>
        `
      }
    ];

    let activeIndex = 0;

    // Render TOC Navigation Sidebar
    function buildTOC() {
      const list = document.getElementById('toc-links');
      list.innerHTML = '';
      pages.forEach((p, idx) => {
        const btn = document.createElement('button');
        btn.onclick = () => { activeIndex = idx; renderView(); toggleMobileDrawer(false); };
        btn.className = `w-full text-left px-3.5 py-2.5 rounded-xl transition flex items-center justify-between ${
          idx === activeIndex 
            ? 'bg-kaneOrange/15 text-kaneOrange font-bold border border-kaneOrange/30' 
            : 'text-gray-400 hover:text-white hover:bg-kaneCard'
        }`;
        btn.innerHTML = `
          <span class="truncate">${p.navLabel}</span>
          <span class="text-[10px] opacity-40">${idx + 1}</span>
        `;
        list.appendChild(btn);
      });
    }

    // Render Active Content Page
    function renderView() {
      const page = pages[activeIndex];
      const stage = document.getElementById('page-content');

      stage.innerHTML = `
        <div class="border-b border-kaneBorder pb-6">
          <span class="text-xs font-black uppercase tracking-widest text-kaneOrange">${page.section}</span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-1 leading-tight">${page.title}</h1>
          <p class="text-sm text-gray-400 mt-2">${page.tagline}</p>
        </div>
        ${page.bodyHTML}
      `;

      // Update Navigation Bars
      document.getElementById('mobile-top-title').innerText = page.navLabel;
      document.getElementById('progress-indicator').innerText = `Step ${activeIndex + 1} of ${pages.length}`;
      document.getElementById('progress-meter').style.width = `${((activeIndex + 1) / pages.length) * 100}%`;

      // Forward/Back Buttons
      const prev = document.getElementById('prev-btn');
      const next = document.getElementById('next-btn');
      prev.disabled = activeIndex === 0;
      next.disabled = activeIndex === pages.length - 1;

      if (activeIndex > 0) {
        document.getElementById('prev-title').innerText = pages[activeIndex - 1].navLabel;
      }
      if (activeIndex < pages.length - 1) {
        document.getElementById('next-title').innerText = pages[activeIndex + 1].navLabel;
      }

      buildTOC();
      restoreSavedInputs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextStep() {
      if (activeIndex < pages.length - 1) {
        activeIndex++;
        renderView();
      }
    }

    function prevStep() {
      if (activeIndex > 0) {
        activeIndex--;
        renderView();
      }
    }

    function toggleMobileDrawer(forceClose) {
      const drawer = document.getElementById('toc-drawer');
      if (forceClose === false) {
        drawer.classList.add('-translate-x-full');
      } else {
        drawer.classList.toggle('-translate-x-full');
      }
    }

    // Interactive Exercises Logic
    function updateLoveScore(val) {
      document.getElementById('display-love').innerText = val;
      const alert = document.getElementById('love-alert');
      if (parseInt(val) < 7) {
        alert.classList.remove('hidden');
      } else {
        alert.classList.add('hidden');
      }
      localStorage.setItem('kane_love', val);
    }

    function calcKaneStandard() {
      const inputs = document.querySelectorAll('.score-input');
      let sum = 0;
      inputs.forEach(i => sum += parseInt(i.value));
      // Project to 50 scale
      const total = Math.round((sum / (inputs.length * 5)) * 50);
      document.getElementById('kane-score-display').innerText = `${total} / 50`;
      
      const trigger = document.getElementById('audit-trigger-card');
      const status = document.getElementById('kane-total-text');
      if (total < 30) {
        trigger.classList.remove('hidden');
        status.innerText = 'Status: Urgent Program Concerns';
      } else {
        trigger.classList.add('hidden');
        status.innerText = 'Status: Solid Development Alignment';
      }
    }

    function selectDecision(val) {
      const card = document.getElementById('gameplan-card');
      if (val === 'adjust' || val === 'change') {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
      localStorage.setItem('kane_decision', val);
    }

    function saveInput(key, val) {
      localStorage.setItem('kane_' + key, val);
    }

    function restoreSavedInputs() {
      if (document.getElementById('input_love')) {
        const val = localStorage.getItem('kane_love') || 8;
        document.getElementById('input_love').value = val;
        updateLoveScore(val);
      }
      if (document.getElementById('input_words')) {
        document.getElementById('input_words').value = localStorage.getItem('kane_day0_words') || '';
      }
      if (document.getElementById('input_day1_log')) {
        document.getElementById('input_day1_log').value = localStorage.getItem('kane_day1_log') || '';
      }
    }

    // Audio Player Bar
    function triggerAudio(title, src) {
      const bar = document.getElementById('vault-player');
      const audio = document.getElementById('native-audio');
      document.getElementById('vault-title').innerText = title;
      audio.src = src;
      bar.classList.remove('hidden');
      audio.play();
    }

    function dismissAudio() {
      const bar = document.getElementById('vault-player');
      const audio = document.getElementById('native-audio');
      audio.pause();
      bar.classList.add('hidden');
    }

    // Keyboard Arrow Listeners
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowRight') nextStep();
      if (e.key === 'ArrowLeft') prevStep();
    });

    // Initialize View
    renderView();
  </script>
</body>
</html>
