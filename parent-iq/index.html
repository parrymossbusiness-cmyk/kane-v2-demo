<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Basketball Parent IQ System | The Kane Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kaneOrange: '#F95B12',
            kaneDark: '#111113',
            kaneSidebar: '#17171A',
            kaneCard: '#1E1E22',
            kaneBorder: '#2C2C32'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-kaneDark text-gray-100 flex flex-col min-h-screen font-sans">

  <!-- Mobile Top Header -->
  <header class="lg:hidden sticky top-0 z-40 bg-kaneSidebar/95 backdrop-blur border-b border-kaneBorder px-4 py-3 flex items-center justify-between">
    <button onclick="KANE_APP.toggleDrawer()" class="p-1.5 rounded-lg border border-kaneBorder text-gray-300">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="text-xs font-black uppercase tracking-wider text-kaneOrange">Kane Academy</span>
    <span class="text-xs text-gray-400">Parent IQ Portal</span>
  </header>

  <!-- App Shell -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto">
    <!-- Persistent TOC Sidebar -->
    <aside id="toc-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-kaneSidebar border-r border-kaneBorder transform -translate-x-full lg:translate-x-0 lg:static lg:h-[calc(100vh-4rem)] lg:sticky lg:top-0 transition-transform duration-200 flex flex-col">
      <div class="p-5 border-b border-kaneBorder flex justify-between items-center">
        <div>
          <span class="text-[10px] uppercase font-black text-kaneOrange tracking-widest">14-Day System</span>
          <h2 class="text-sm font-extrabold text-white">Table of Contents</h2>
        </div>
        <button onclick="KANE_APP.toggleDrawer(false)" class="lg:hidden text-gray-400 hover:text-white">&times;</button>
      </div>
      <nav id="toc-nav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
      <div class="p-4 border-t border-kaneBorder bg-kaneSidebar/60">
        <a href="sms:+13103453033?&body=Hi%20Coach%20Kane," class="block w-full py-2.5 text-center bg-kaneCard hover:border-kaneOrange border border-kaneBorder rounded-xl text-xs font-bold text-gray-300">Text Dennis: (310) 345-3033</a>
      </div>
    </aside>

    <!-- Content Stage -->
    <main class="flex-1 min-w-0 px-4 sm:px-10 py-8 lg:py-10 pb-36 max-w-3xl">
      <div id="content-stage" class="space-y-8"></div>
    </main>
  </div>

  <!-- Persistent Bottom Bar -->
  <footer class="fixed bottom-0 inset-x-0 z-40 bg-kaneSidebar/95 backdrop-blur border-t border-kaneBorder py-3 px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
      <button id="prev-btn" onclick="KANE_APP.prev()" class="px-4 py-2 rounded-xl bg-kaneCard border border-kaneBorder text-xs font-bold text-gray-300 hover:text-white disabled:opacity-30">Previous</button>
      <div class="text-center">
        <p id="progress-indicator" class="text-xs font-bold text-white tracking-wide">1 of 24</p>
        <div class="w-32 sm:w-48 bg-gray-800 rounded-full h-1 mt-1 overflow-hidden">
          <div id="progress-meter" class="bg-kaneOrange h-1 rounded-full transition-all duration-200" style="width: 5%"></div>
        </div>
      </div>
      <button id="next-btn" onclick="KANE_APP.next()" class="px-5 py-2 rounded-xl bg-kaneOrange hover:bg-orange-600 text-xs font-bold text-white disabled:opacity-30">Next</button>
    </div>
  </footer>

  <!-- Floating Audio Player -->
  <div id="global-vault-player" class="hidden fixed bottom-16 sm:bottom-20 left-4 right-4 max-w-lg mx-auto bg-kaneCard border border-kaneOrange/40 rounded-2xl p-4 shadow-2xl z-50 flex items-center justify-between gap-4">
    <div class="truncate">
      <span id="vault-track-tag" class="text-[10px] text-kaneOrange font-black uppercase tracking-wider block">Conversation Vault</span>
      <p id="vault-track-title" class="text-xs font-bold text-white truncate">Audio Track</p>
    </div>
    <audio id="native-audio-element" controls class="h-8 max-w-[180px]"></audio>
    <button onclick="KANE_APP.dismissAudio()" class="text-gray-400 hover:text-white font-bold">&times;</button>
  </div>

<!-- Scripts -->
<script src="/parent-iq/js/engine.js?v=2"></script>
<script src="/parent-iq/js/content-data.js?v=2"></script>
</body>
</html>
